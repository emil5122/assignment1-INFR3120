<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emil Murphy Portfolio - Contact</title>

    <!-- Style Sheet Importing based on screen size -->
    <meta name="viewport" content="width=device-width"> <!-- Prevent distortion of screen size -->
    <!-- Screen Style Sheet (Default)-->
    <link href="screen.css" rel="stylesheet" type="text/css" media="only screen and (min-width:960px)">
    <!-- Tablet style sheet-->
    <link href="tablet.css" rel="stylesheet" type="text/css" media="only screen and (min-width:481px) and (max-width:960px)">
    <!-- Phone style sheet-->
    <link href="phone.css" rel="stylesheet" type="text/css" media="only screen and (max-width:480px)">

      <!-- Import Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <h3>Emil Murphy - Contact</h3>
            <a href="index.html">Home</a> 
            <a href="about.html">About</a> 
            <a href="projects.html">Projects</a>
            <a href="contact.html"><b>Contact</b></a> <!--Bold because we are currently here -->
        </nav>
    </header>
    <article>
        <!-- Form for contact information-->
        <h2>Contact Form</h2>
        <section> 
            <form action=mailto:emil.murphy@ontariotechu.net method="post" enctype="text/plain" name="ContactForm"> <!--Opens mail client and prepares an email to send to my address. -->
                <p>
                    <label for="name">Name *</label><br>
                    <input id="name" type="text" name="name" size="32" required>  <!-- * because required -->
                </p>
                <p>
                    <label for="email">Email *</label><br>
                    <input id="email" type="email" name="email" size="32" required> <!-- * because required -->
                </p>
                <p>
                    <label for="phone">Phone</label><br>
                    <input id="phone" type="tel" name="phone" size="32">  <!-- Phone is not really required so im not requiring it. -->
                </p>
                <p>
                    <label for="message">Message *</label><br>
                    <textarea id="message" minlength="1" name="message" cols="40" rows="6" required></textarea> <!-- * because required, minlength to avoid short/small messages -->
                </p>
                <p><input type="submit" value="Submit Contact Information"></p>
                <p><input type="reset" value="Reset Contact Information"></p>
            </form>
        </section>
    </article>
    <footer>
        <P>© 2026 Emil Murphy ~ Contact: emil.murphy@ontariotechu.net</P>
    </footer>
    
</body>
</html>
