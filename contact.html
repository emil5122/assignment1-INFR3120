    <article>
        <!-- Form for contact information-->
        <section> <!-- TODO: figure out action="" -->
            <form method="post" enctype="text/plain" name="ContactForm">
                <p>
                    <label for="name">Name</label><br>
                    <input type="text" name="name" size="32">
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="text" name="email" size="32">
                </p>
                <p>
                    <label for="message">Message</label><br>
                    <textarea name="message" cols="40" rows="6"></textarea>
                </p>
                <p>
                    <label for="nobots">What color is grass? (No robots allowed)</label><br> <!-- anti bot, correct answer is green -->
                    <input type="text" name="nobots" size="32">
                </p>
                <p><input type="submit" value="Submit Contact Information"/></p>
                <p><input type="reset" value="Reset Contact Information"/></p>
            </form>
        </section>
